services:
  slot-drill:
    build: .
    image: pg-slot-cleanup-drill:local
    container_name: pg-slot-cleanup-drill
    ports:
      - "${DRILL_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/drill.db
      PREVIEW_TTL_SECONDS: "${PREVIEW_TTL_SECONDS:-900}"
      SEED_DEMO: "${SEED_DEMO:-true}"
      ENABLE_DEMO: "${ENABLE_DEMO:-true}"
      SQLITE_BUSY_TIMEOUT_MS: "${SQLITE_BUSY_TIMEOUT_MS:-5000}"
    volumes:
      - drill-data:/data
    restart: unless-stopped

volumes:
  drill-data:
